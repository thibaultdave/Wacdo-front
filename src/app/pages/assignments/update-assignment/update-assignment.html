<div class="form-container">
  <form [formGroup]="assignmentForm" (ngSubmit)="updateAssignment()">

    <div class="form-heading">
        <h1>Modifier une affectation</h1>
        <p>Modifiez les informations de l'affectation.</p>
    </div>

    <div class="form-fields">
        <app-form-field id="collaborator" label="Collaborateur" [control]="assignmentForm.get('collaborator')!"
            type="select" [options]="collaboratorOptions()" placeholder="Sélectionner un collaborateur"
            [errors]="[ 
                {key: 'required', message: 'Le collaborateur est requis.'}
            ]"
        />

        <app-form-field id="restaurant" label="Restaurant" [control]="assignmentForm.get('restaurant')!"
            type="select" [options]="restaurantOptions()" placeholder="Sélectionner un restaurant"
            [errors]="[ 
                {key: 'required', message: 'Le restaurant est requis.'}
            ]"
        />

        <app-form-field id="job" label="Poste" [control]="assignmentForm.get('job')!"
            type="select" [options]="jobOptions()" placeholder="Sélectionner un poste"
            [errors]="[ 
                {key: 'required', message: 'Le poste est requis.'}
            ]"
        />

        <app-form-field id="startDate" label="Date de début" [control]="assignmentForm.get('startDate')!" type="date"
            [errors]="[ 
                {key: 'required', message: 'La date de début est requise.'},
                {key: 'futureDate', message: 'La date ne peut pas être dans le futur.'}
            ]"
        />

        <app-form-field id="endDate" label="Date de fin" [control]="assignmentForm.get('endDate')!" type="date" [isRequired]="false"
            [errors]="[
                {key: 'futureDate', message: 'La date ne peut pas être dans le futur.'}
            ]"
        />
    </div>

    <div class="form-footer">
      <p class="required-note"><span>*</span> Champs obligatoires</p>
      <button type="submit" [disabled]="assignmentForm.invalid">Modifier l'affectation</button>
    </div>

  </form>
</div>
