<main class="jobs-page">
  <section class="jobs-toolbar">
    <div class="page-heading">
      <h1>Gestion des postes</h1>
      <a class="create-button" [routerLink]="['/jobs/new']">
        <span aria-hidden="true">+</span>
        Nouveau poste
      </a>
    </div>
    <div class="filters">
      <app-filter inputId="filter-name" label="Intitulé du poste" placeholder="Rechercher un poste..." [value]="nameFilter()" (valueChange)="nameFilter.set($event)"/>
    </div>
  </section>

  <section class="jobs-section">
    <h2>Liste des postes</h2>

    @if (jobs().length > 0) {
      @if (filteredJobs().length > 0) {
        <div class="jobs-list">
          @for (job of filteredJobs(); track job.id) {
            <app-job [job]="job" (jobsUpdated)="refreshJobs()"/>
          }
        </div>
      } @else {
        <p class="empty-message">Aucun poste ne correspond à votre recherche.</p>
      }
    } @else {
      <p class="empty-message">Aucun poste disponible.</p>
    }
  </section>
</main>
