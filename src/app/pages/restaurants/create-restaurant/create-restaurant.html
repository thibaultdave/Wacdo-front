<div class="form-container">
    <form [formGroup]="restaurantForm" (ngSubmit)="createRestaurant()">

        <div class="form-heading">
            <h1>Créer un restaurant</h1>
            <p>Renseignez les informations du nouveau restaurant.</p>
        </div>

        <div class="form-fields">
            <app-form-field id="name" label="Nom" [control]="restaurantForm.get('name')!" placeholder="Nom du restaurant"
                [errors]="[ 
                    {key: 'required', message: 'Le nom est requis.'}
                ]"
            />

            <app-form-field id="address" label="Adresse" [control]="restaurantForm.get('address')!" placeholder="Adresse du restaurant"
                [errors]="[ 
                    {key: 'required', message: 'L\'adresse est requise.'}
                ]"
            />

            <app-form-field id="postalCode" label="Code postal" [control]="restaurantForm.get('postalCode')!" placeholder="Code postal du restaurant"
                [errors]="[ 
                    {key: 'required', message: 'Le code postal est requis.'},
                    {key: 'minlength', message: 'Le code postal doit faire 5 caractères.'},
                    {key: 'maxlength', message: 'Le code postal doit faire 5 caractères.'}
                ]"
            />

            <app-form-field id="city" label="Ville" [control]="restaurantForm.get('city')!" placeholder="Ville du restaurant"
                [errors]="[ 
                    {key: 'required', message: 'La ville est requise.'}
                ]"
            />
        </div>

        <div class="form-footer">
            <p class="required-note"><span>*</span> Champs obligatoires</p>
            <button type="submit" [disabled]="restaurantForm.invalid">Créer le restaurant</button>
        </div>
    </form>
</div>
