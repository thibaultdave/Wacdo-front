<main class="collaborators-page">
  <header class="page-heading">
    <div>
      <h1>Gestion des collaborateurs</h1>
      <p>Consulte et gère les collaborateurs de Wacdo.</p>
      <a class="inline-block mb-4 text-white-600 underline" [routerLink]="['/collaborators/new']">+ Nouveau collaborateur</a>
    </div>
  </header>

  <section class="collaborators-section">
    <h2>Liste des collaborateurs</h2>

    @if (collaborators().length > 0) {
      <div class="collaborators-list">
        @for (collaborator of collaborators(); track collaborator.id) {
          <app-collaborator [collaborator]="collaborator" (collaboratorsUpdated)="refreshCollaborators()"/>
        }
      </div>
    } @else {
      <p class="empty-message">Aucun collaborateur disponible.</p>
    }
  </section>
</main>
