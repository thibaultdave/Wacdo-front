<div>
    <h1>Gestion des collaborateurs</h1>
    <h2>Liste de tous les collaborateurs</h2>
    <!--<a class="inline-block mb-4 text-blue-600 underline" (click)="createCollaborator()">+ Nouveau collaborateur</a>-->

    @if (collaborators().length > 0) {
        @for (collaborator of collaborators(); track collaborator.id) {
            <app-collaborator [collaborator]="collaborator" />
        }
    } @else {
        <p>Aucun collaborateur disponible.</p>
    }

</div>
