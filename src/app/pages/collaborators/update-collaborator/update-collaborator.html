<div class="form-container">
  <form [formGroup]="collaboratorForm" (ngSubmit)="updateCollaborator()">

    <div class="form-heading">
      <h1>Modifier un collaborateur</h1>
      <p>Modifiez les informations du collaborateur.</p>
    </div>

    <div class="form-fields">
      <app-form-field id="firstName" label="Prénom" [control]="collaboratorForm.get('firstName')!" placeholder="Ex. : Gérard"
        [errors]="[ 
          {key: 'required', message: 'Le prénom est requis.'}
        ]"
      />

      <app-form-field id="lastName" label="Nom" [control]="collaboratorForm.get('name')!" placeholder="Ex. : Bouchard"
        [errors]="[ 
          {key: 'required', message: 'Le nom est requis.'}
        ]"
      />

      <app-form-field id="email" label="Adresse e-mail" [control]="collaboratorForm.get('email')!" placeholder="gerard.bouchard@exemple.fr" type="email"
        [errors]="[ 
          {key: 'required', message: 'L\'adresse e-mail est requise.'},
          {key: 'email', message: 'Format d\'adresse e-mail invalide.'}
        ]"
      />

      <app-form-field id="firstHireDate" label="Date de première embauche" [control]="collaboratorForm.get('firstHireDate')!" type="date"
        [errors]="[ 
          {key: 'required', message: 'La date de première embauche est requise.'},
          {key: 'futureDate', message: 'La date ne peut pas être dans le futur.'}
        ]"
      />

      <app-form-field id="password" label="Mot de passe" [isRequired]="false" [control]="collaboratorForm.get('password')!" type="password"
        placeholder="Définir un nouveau mot de passe" moreInfo="laisser vide pour ne pas modifier"
        [errors]="[ 
          {key: 'minlength', message: 'Le mot de passe doit contenir au moins 8 caractères.'}
        ]"
      />
    </div>

    <label class="admin-option" for="admin">
      <input id="admin" formControlName="admin" type="checkbox" />
      <span class="admin-option-text">
        <strong>Administrateur</strong>
      </span>
    </label>

    <div class="form-footer">
      <p class="required-note"><span>*</span> Champs obligatoires</p>
      <button type="submit" [disabled]="collaboratorForm.invalid">Enregistrer les modifications</button>
    </div>

  </form>
</div>
