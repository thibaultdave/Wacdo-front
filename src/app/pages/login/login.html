<div class="flex flex-col items-center justify-center px-4">
  @if (sessionExpired) {
    <div class="session-expired-message" role="alert">
      Votre session a expiré. Veuillez vous reconnecter.
    </div>
  }
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()"  class="w-full max-w-md bg-white p-8 rounded-lg shadow-md flex flex-col gap-4">
    <h2>Connexion</h2>

    <input type="email" placeholder="Email" formControlName="email">
    <input type="password" placeholder="Mot de passe" formControlName="password">

    @if (errorMessage()) {
      <small >{{ errorMessage() }}</small>
    }
    
    <button>Se connecter</button>
  </form>
</div>
