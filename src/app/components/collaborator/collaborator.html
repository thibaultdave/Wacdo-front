<article class="collaborator-card">
  <div class="collaborator-info">
    <div class="collaborator-avatar">
      {{ collaborator.firstName.charAt(0) }}{{ collaborator.name.charAt(0) }}
    </div>

    <div class="collaborator-details">
      <div class="collaborator-heading">
        <h3>{{ collaborator.firstName }} {{ collaborator.name }}</h3>

        @if (collaborator.admin) {
          <span class="admin-badge">Administrateur</span>
        } @else {
          <span class="user-badge">Collaborateur</span>
        }
      </div>

      <p class="collaborator-email">{{ collaborator.email }}</p>

      <p class="collaborator-date">
        Embauché le {{ changeDateFormat(collaborator.firstHireDate) }}
      </p>
    </div>
  </div>

  <div class="collaborator-actions">
    <button type="button" class="edit-button"> Modifier </button>

    <button type="button" class="delete-button" [disabled]="isSameUser()" (click)="deleteCollaborator()"> Supprimer </button>
  </div>
</article>
