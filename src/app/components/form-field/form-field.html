<div class="form-element">
    <label [for]="id">
        {{ label }}
        @if (moreInfo) {
            <small class="info">( {{ moreInfo }} )</small>
        }
        @if (isRequired) { <span>*</span> }
    </label>

    @if (type === 'select') {
        <select [id]="id" [formControl]="$any(control)">
            <option [ngValue]="null" disabled   >{{ placeholder || '-- Sélectionner --' }}</option>
            @for (option of options; track option.value) {
                <option [ngValue]="option.value"> {{ option.label }} </option>
            }
        </select>
    } @else {
        <input [id]="id" [formControl]="$any(control)" [type]="type" [placeholder]="placeholder" autocomplete="off"/>
    }

    @if (control?.touched || control?.dirty) {
        @for (error of errors; track error.key) {
            @if (control?.hasError(error.key)) {
                <small class="error"> {{ error.message }} </small>
            }
        }
    }
</div>
