<header class="text-white p-4">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="text-xl font-bold cursor-pointer" routerLink="/" cursor-pointer>Wacdo Manager</h1>

    <nav class="flex items-center gap-4">
      <a class="mr-4" routerLink="/">Accueil</a>
      @if (isAuthenticated()) {
        <div class="flex items-center gap-4">
          <a class="mr-4" routerLink="/collaborators">Collaborateurs</a>
          <a class="mr-4" routerLink="/restaurants">Restaurants</a>
          <a class="mr-4" routerLink="/jobs">Postes</a>
          <a class="mr-4" routerLink="/assignments">Affectations</a>
          <h4 class="m-0 font-medium"> Bonjour, {{ userEmail }} </h4>
          <!-- TODO replace userEmail with user firstName and lastName -->
          <button (click)="logout()" class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded">Déconnexion</button>
        </div>
      } @else {
        <a class="mr-4" routerLink="/login">Connexion</a>
      }
    </nav>
  </div>
</header>
